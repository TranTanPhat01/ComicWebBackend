# ==============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# ==============================================================================
services:
  - type: web
    name: comicweb-backend
    env: docker
    plan: free
    region: singapore
    branch: Feature/Deploy
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ASPNETCORE_URLS
        value: http://+:8080

      - key: PORT
        value: 8080

      # Connection to Supabase Postgres (Secret: required to fill on Render UI)
      - key: ConnectionStrings__DefaultConnection
        sync: false

      # Optional connection to Upstash Redis (Default empty, falls back to Memory Cache)
      - key: ConnectionStrings__RedisConnection
        value: ""

      - key: Jwt__Issuer
        value: ComicWeb

      - key: Jwt__Audience
        value: ComicWebFrontend

      - key: Jwt__SigningKey
        value: SecureKeyForComicWebBackendDeployment2026AtLeast32Bytes

      - key: BootstrapAdmin__Enabled
        value: "true"

      # Default admin bootstrap password (Secret: required to fill on Render UI)
      - key: BootstrapAdmin__Password
        sync: false

      - key: DatabaseInitialization__ApplyMigrationsOnStartup
        value: "true"

      - key: ScheduledPublishing__Enabled
        value: "true"

      - key: PublicCache__Enabled
        value: "true"

      - key: AllowedHosts
        value: "*"
