name: Deploy to Render

on:
  push:
    branches:
      - Feature/Deploy
      - main

jobs:
  deploy:
    name: Deploy API Service
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub."
            exit 1
          fi
          echo "Triggering Render deployment..."
          curl -f -X POST "$DEPLOY_HOOK"
          echo "Deployment trigger sent successfully!"
